name: Deploy JarvisBot to Azure Container Instances

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log into Azure Container Registry
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/jarvisbot:latest .

    - name: Push Docker Image to ACR
      run: |
        docker push ${{ secrets.ACR_NAME }}.azurecr.io/jarvisbot:latest

    - name: Deploy to Azure Container Instances
      uses: azure/aci-deploy@v1
      with:
        resource-group: ${{ secrets.RESOURCE_GROUP }}
        dns-name-label: ${{ secrets.ACI_NAME }}
        image: ${{ secrets.ACR_NAME }}.azurecr.io/jarvisbot:latest
        name: ${{ secrets.ACI_NAME }}
        registry-login-server: ${{ secrets.ACR_NAME }}.azurecr.io
        registry-username: ${{ secrets.ACR_NAME }}
        registry-password: ${{ secrets.AZURE_CREDENTIALS }} # Assuming Service Principal has AcrPull/AcrPush
        location: eastus
        ports: 80
        secure-environment-variables: |
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
        environment-variables: |
          USE_AI_INTENT=True
          OWNER=${{ secrets.OWNER_ID }}
        volumes: |
          - name: datavolume
            mountPath: /app/data
            storageAccountName: ${{ secrets.STORAGE_ACCOUNT_NAME }}
            storageAccountKey: ${{ secrets.STORAGE_ACCOUNT_KEY }}
            shareName: jarvisdata
