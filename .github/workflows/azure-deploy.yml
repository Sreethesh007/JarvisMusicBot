name: Deploy Bot to Azure Container Instances

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

env:
  RESOURCE_GROUP: "jarvis-bot-rg"
  CONTAINER_NAME: "jarvis-bot-container"
  IMAGE_NAME: "jarvis-bot"
  FILE_SHARE_NAME: "jarvis-bot-data"
  LOCATION: "eastus" # Ensure this matches scripts/azure-deploy.sh

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Infrastructure
        id: infra
        run: |
          chmod +x scripts/azure-deploy.sh
          ./scripts/azure-deploy.sh

          # Extract values generated by the script
          ACR_NAME=$(az acr list --resource-group ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv)
          ACR_LOGIN_SERVER=$(az acr show --name $ACR_NAME --query loginServer -o tsv)
          STORAGE_ACCOUNT_NAME=$(az storage account list --resource-group ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv)
          STORAGE_ACCOUNT_KEY=$(az storage account keys list --resource-group ${{ env.RESOURCE_GROUP }} --account-name $STORAGE_ACCOUNT_NAME --query "[0].value" -o tsv)

          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "storage_account_name=$STORAGE_ACCOUNT_NAME" >> $GITHUB_OUTPUT
          echo "::add-mask::$STORAGE_ACCOUNT_KEY"
          echo "storage_account_key=$STORAGE_ACCOUNT_KEY" >> $GITHUB_OUTPUT

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ steps.infra.outputs.acr_name }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ steps.infra.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          LATEST_TAG=${{ steps.infra.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:latest

          docker build -t $IMAGE_TAG -t $LATEST_TAG .
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

          echo "image_tag=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Azure Container Instances
        run: |
          # Get ACR credentials for ACI
          ACR_USERNAME=$(az acr credential show --name ${{ steps.infra.outputs.acr_name }} --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name ${{ steps.infra.outputs.acr_name }} --query "passwords[0].value" -o tsv)

          echo "Deleting existing container if it exists..."
          az container delete --name ${{ env.CONTAINER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --yes || true

          echo "Creating new container instance..."
          az container create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_NAME }} \
            --image ${{ env.image_tag }} \
            --cpu 1 \
            --memory 1 \
            --os-type Linux \
            --registry-login-server ${{ steps.infra.outputs.acr_login_server }} \
            --registry-username $ACR_USERNAME \
            --registry-password "$ACR_PASSWORD" \
            --azure-file-volume-account-name ${{ steps.infra.outputs.storage_account_name }} \
            --azure-file-volume-account-key "${{ steps.infra.outputs.storage_account_key }}" \
            --azure-file-volume-share-name ${{ env.FILE_SHARE_NAME }} \
            --azure-file-volume-mount-path /app/data \
            --secure-environment-variables \
              DISCORD_TOKEN="${{ secrets.DISCORD_TOKEN }}" \
              USE_AI_INTENT="True" \
              GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              SPOTIFY_CLIENT_ID="${{ secrets.SPOTIFY_CLIENT_ID }}" \
              SPOTIFY_CLIENT_SECRET="${{ secrets.SPOTIFY_CLIENT_SECRET }}"
